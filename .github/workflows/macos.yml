name: MacOS

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        toolchain:
          - stable

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: brew install librtlsdr
    - name: use stable toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: format
      run: cargo fmt --all -- --check
    - name: build
      run: cargo build --release --verbose
    - name: clippy
      run: cargo clippy --release --all-targets -- -D warnings
    - name: test
      run: cargo test --release --verbose

    - name: test (hermetic end-to-end positioning)
      # The #[ignore]d tier: recording-based tests skip cleanly when their
      # inputs are absent (always, in CI), so this effectively runs the
      # hermetic synthetic-geometry IQ->fix regression.
      run: cargo test --release -- --ignored
