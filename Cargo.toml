[package]
name = "gnss-rcv"
version = "0.1.0"
authors = ["Maxime Austruy <austruym@gmail.com>"]
edition = "2024"

[profile.release]
# line-tables-only keeps file:line in panic/coredump backtraces but skips the
# heavy per-variable debuginfo, so every incremental release link is faster.
debug = "line-tables-only"

# Make debug builds actually runnable: lightly optimize our own crate and fully
# optimize dependencies (a one-time cost, then cached). `cargo run`/`cargo test`
# without --release then exercise the DSP at a usable rate while compiling much
# faster than release -- shrinking the edit→run loop.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.10"
colored = "3.1.1"
rustfft = "6.4.1"
bytesize = { version = "2.3.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
log = "0.4.32"
ctrlc = "3.5.2"
rayon = "1.12.0"
coredump = "0.1.2"
plotters = "0.3.7"
glob = "0.3.3"
chrono = "0.4.45"
gnss-rtk = "0.8.0"
gnss-rs = "2.6.0"
# anise is a transitive dep via gnss-rtk, but gnss-rtk only activates embed_ephem
# for its own dev-deps. We need it directly to unlock Almanac::until_2035(), which
# embeds the Earth orientation (pck11.pca) and planetary ephemeris (de440s.bsp)
# required by gnss-rtk's Solver::new_survey to set up the EARTH_J2000 frame.
anise = { version = "0.6", features = ["embed_ephem"] }
map_3d = "0.1.7"
egui = "0.35"
eframe = "0.35"
egui_extras = "0.35"
galileo-osnma = { version = "0.11.6", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[target.'cfg(unix)'.dependencies]
rtlsdr_mt = { git = 'https://github.com/mx4/rtlsdr_mt.rs.git', rev = '8ae8911b06be9680b92ef40367e72134b186aae9' }

[dev-dependencies]
dhat = "0.3"
